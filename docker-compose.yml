services:
  postgres:
    image: postgres:17-alpine
    container_name: task-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: